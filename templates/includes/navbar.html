<!-- Top Navbar -->
<header class="top-navbar">
    <div class="navbar-left">
        <button class="btn btn-link sidebar-toggle d-lg-none" id="sidebarToggle">
            <i class="bi bi-list"></i>
        </button>
        <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
    </div>
    <div class="navbar-right">
        <!-- Search -->
        <div class="search-container d-none d-md-flex">
            <form method="get" action="{% url 'tracker:post_list' %}" class="search-form">
                <i class="bi bi-search search-icon"></i>
                <input type="text" name="q" class="search-input" placeholder="Search posts..." 
                       value="{{ request.GET.q|default:'' }}">
            </form>
        </div>

        <!-- Notifications -->
        <a href="{% url 'notifications:list' %}" class="nav-icon-btn" title="Notifications">
            <i class="bi bi-bell"></i>
            {% if unread_notifications_count > 0 %}
            <span class="notification-dot"></span>
            {% endif %}
        </a>

        <!-- User Menu -->
        <div class="dropdown">
            <button class="user-menu-btn dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                <div class="user-avatar">
                    {{ user.get_full_name|default:user.email|first|upper }}
                </div>
                <span class="d-none d-md-inline user-name">{{ user.get_full_name|default:user.email }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="{% url 'accounts:profile' %}">
                    <i class="bi bi-person me-2"></i>Profile
                </a></li>
                <li><a class="dropdown-item" href="{% url 'accounts:settings' %}">
                    <i class="bi bi-gear me-2"></i>Settings
                </a></li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item text-danger" href="{% url 'account_logout' %}">
                    <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                </a></li>
            </ul>
        </div>
    </div>
</header>
