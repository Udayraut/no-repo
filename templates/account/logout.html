{% extends 'base.html' %}

{% block title %}Sign Out — Skyniya Growth OS{% endblock %}

{% block content_auth %}
<div class="auth-card text-center">
    <div class="auth-logo">
        <i class="bi bi-box-arrow-right text-secondary fs-1 mb-2"></i>
        <h2>Sign Out</h2>
        <p>Are you sure you want to sign out of Skyniya Growth OS?</p>
    </div>

    <form method="post" action="{% url 'account_logout' %}">
        {% csrf_token %}
        {% if redirect_field_value %}
        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}"/>
        {% endif %}
        <button type="submit" class="btn btn-danger w-100 mb-2">Sign Out</button>
        <a href="{% url 'dashboard:index' %}" class="btn btn-outline-secondary w-100">Cancel</a>
    </form>
</div>
{% endblock %}
